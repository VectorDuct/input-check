name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: GOMAXPROCS=1 go test -p 1 ./... -count=1 -timeout 60s
      - run: GOMAXPROCS=1 go vet -p 1 ./...
      - run: CGO_ENABLED=0 GOMAXPROCS=1 go build -p 1 -trimpath -o bin/inputcheck ./cmd/inputcheck
      - run: bin/inputcheck check -strict -input examples/request.json
      - run: bin/inputcheck serve -config examples/config.inspect.json -check-config
      - run: python3 tools/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: inputcheck-source
          path: dist/input-check-0.1.0.zip
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inputcheck:test .
