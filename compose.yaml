services:
  inputcheck:
    build: .
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./examples/config.docker.json:/etc/inputcheck/config.json:ro
    environment:
      INPUTCHECK_TOKEN: ${INPUTCHECK_TOKEN:?Set a random gateway token of at least 16 bytes}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 95s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
